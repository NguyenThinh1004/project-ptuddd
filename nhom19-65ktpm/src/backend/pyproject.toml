[project]
name = "studymate-speech-backend"
version = "1.0.0"
description = "StudyMate AI Speech Pronunciation Evaluation Microservice (FastAPI + NLTK CMUDict/IPA + Faster-Whisper)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "nltk>=3.9.1",
    "g2p-en>=2.1.0",
    "faster-whisper>=1.1.0",
    "av>=13.0.0",
    "numpy>=1.26.0,<2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
